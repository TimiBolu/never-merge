<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Never Merge Options</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <header>
        <div class="brand-lockup">
          <img class="brand-mark" src="assets/icon-128.png" alt="" aria-hidden="true">
          <div>
            <h1>Never Merge</h1>
            <p>Hide GitHub merge controls for selected organizations and repositories.</p>
          </div>
        </div>
      </header>

      <form id="settings-form">
        <label for="blocked-owners">Blocked organizations or users</label>
        <textarea id="blocked-owners" rows="6" spellcheck="false" placeholder="acme-corp&#10;high-risk-org"></textarea>
        <p class="hint">One GitHub owner per line.</p>

        <label for="blocked-repositories">Blocked repositories</label>
        <textarea id="blocked-repositories" rows="6" spellcheck="false" placeholder="acme-corp/payroll&#10;high-risk-org/platform"></textarea>
        <p class="hint">Use owner/repository, one per line.</p>

        <footer>
          <button type="submit">Save</button>
          <span id="status" role="status" aria-live="polite"></span>
        </footer>
      </form>
    </main>

    <script src="options.js"></script>
  </body>
</html>
