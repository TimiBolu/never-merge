<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Never Merge</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <img class="brand-mark" src="assets/icon-48.png" alt="" aria-hidden="true">
        <div>
          <h1>Never Merge</h1>
          <p id="repo">Checking page...</p>
        </div>
        <span id="state-pill">...</span>
      </header>

      <section id="github-controls" hidden>
        <p id="message"></p>
        <div class="button-grid" aria-label="Snooze durations">
          <button type="button" data-snooze-minutes="5">5 min</button>
          <button type="button" data-snooze-minutes="15">15 min</button>
          <button type="button" data-snooze-minutes="30">30 min</button>
        </div>
        <button id="resume" type="button" class="secondary">Resume now</button>
      </section>

      <section id="empty-state" hidden>
        <p>Open a GitHub pull request to manage protection for that repo.</p>
      </section>

      <footer>
        <button id="options" type="button" class="link-button">Options</button>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
